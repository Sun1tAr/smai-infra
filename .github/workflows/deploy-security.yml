name: deploy-security

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options: [stage, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate JWT key
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$JWT_PRIVATE_KEY" > "$RUNNER_TEMP/jwt-private.pem"

          # gateway принимает только EC P-256 в PEM без пароля
          if grep -q "ENCRYPTED" "$RUNNER_TEMP/jwt-private.pem"; then
            echo "JWT_PRIVATE_KEY is encrypted" >&2
            exit 1
          fi
          pub=$(openssl pkey -in "$RUNNER_TEMP/jwt-private.pem" -passin pass: -noout -text_pub) \
            || { echo "JWT_PRIVATE_KEY is not a valid PEM key" >&2; exit 1; }
          echo "$pub" | grep -q "NIST CURVE: P-256" \
            || { echo "JWT_PRIVATE_KEY is not an EC P-256 key" >&2; exit 1; }

      - name: Install NetBird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: Connect to NetBird
        env:
          NETBIRD_CLUSTER_URL: ${{ secrets.NETBIRD_CLUSTER_URL }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sudo netbird up \
            --management-url "$NETBIRD_CLUSTER_URL" \
            --setup-key "$NETBIRD_SETUP_KEY"

          until getent hosts "$SSH_HOST" >/dev/null 2>&1; do
            echo "waiting for $SSH_HOST..."
            sleep 2
          done

      # Ключ пишется через контейнер: владелец UID 10001 (пользователь gateway), права 0400.
      # Файл подменяется атомарно, gateway монтирует его как secret только на чтение.
      - name: Install JWT key
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/smai/security && chmod 700 ~/smai/security && \
             docker run -i --rm --network none -v ~/smai/security:/security alpine:3.20 sh -c ' \
               umask 077 && \
               cat > /security/.jwt-private.pem.tmp && \
               chown 10001:10001 /security/.jwt-private.pem.tmp && \
               chmod 0400 /security/.jwt-private.pem.tmp && \
               mv -f /security/.jwt-private.pem.tmp /security/jwt-private.pem'" \
            < "$RUNNER_TEMP/jwt-private.pem"

      # Секрет смонтирован bind mount'ом: после подмены файла gateway нужно пересоздать.
      # Смена ключа инвалидирует все выданные токены.
      - name: Restart gateway
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
            set -eu
            if docker ps -a --format '{{.Names}}' | grep -qx smai-gateway; then
              cd ~/smai/services
              docker compose --profile gateway up -d --force-recreate --no-deps gateway
            else
              echo "smai-gateway is not deployed yet, skip restart"
            fi
          EOF

      - name: Smoke test
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
            set -eu
            perms=$(docker run --rm --network none -v ~/smai/security:/security:ro alpine:3.20 \
              stat -c '%u:%g %a' /security/jwt-private.pem)
            [ "$perms" = "10001:10001 400" ] || { echo "unexpected key perms: $perms" >&2; exit 1; }

            if docker ps -a --format '{{.Names}}' | grep -qx smai-gateway; then
              for i in $(seq 1 30); do
                status=$(docker inspect -f '{{.State.Health.Status}}' smai-gateway)
                [ "$status" = "healthy" ] && break
                echo "waiting for smai-gateway... ($status)"
                sleep 2
              done
              [ "$status" = "healthy" ] || { docker logs --tail 50 smai-gateway >&2; exit 1; }
            fi
            echo "security stack OK"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/jwt-private.pem"
