name: deploy-observability

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options: [stage, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NetBird
        run: curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: Connect to NetBird
        env:
          NETBIRD_CLUSTER_URL: ${{ secrets.NETBIRD_CLUSTER_URL }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sudo netbird up \
            --management-url "$NETBIRD_CLUSTER_URL" \
            --setup-key "$NETBIRD_SETUP_KEY"
          
          # ждём, пока маршруты NetBird реально поднимутся
          for i in $(seq 1 30); do
            if sudo netbird status -d 2>/dev/null | grep -q "Connected"; then
              echo "NetBird reports Connected"
              break
            fi
            echo "waiting for netbird status... ($i)"
            sleep 2
          done
          
          # ждём, пока раннер начнёт резолвить хост через NetBird DNS
          for i in $(seq 1 30); do
            if getent hosts "$SSH_HOST" >/dev/null 2>&1; then
              echo "host $SSH_HOST resolved"
              break
            fi
            echo "waiting for host resolution... ($i)"
            sleep 2
          done

      - name: Copy observability stack to VM
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            observability/ "$SSH_USER@$SSH_HOST:~/smai/observability/"

      - name: Render .env and alertmanager template
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          DOMAIN_GRAFANA: ${{ secrets.DOMAIN_GRAFANA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "GRAFANA_ADMIN_PASSWORD='$GRAFANA_ADMIN_PASSWORD' \
             DOMAIN_GRAFANA='$DOMAIN_GRAFANA' \
             TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' \
             TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID' \
             bash -s" <<'EOF'
          set -eu
          cd ~/smai/observability

          # пишем .env из переданных переменных
          cat > .env <<ENV
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          DOMAIN_GRAFANA=${DOMAIN_GRAFANA}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          ENV

          # экспортируем .env в окружение и рендерим шаблон
          set -a
          . ./.env
          set +a

          envsubst '${TELEGRAM_BOT_TOKEN} ${TELEGRAM_CHAT_ID}' \
            < alertmanager/alertmanager.yml.tpl \
            > alertmanager/alertmanager.yml
          EOF

      - name: Download Grafana dashboards
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
            set -eu
            cd ~/smai/observability/grafana/provisioning/dashboards/json

            # скачиваем
            curl -fsSL -o node-exporter.json https://grafana.com/api/dashboards/1860/revisions/latest/download
            curl -fsSL -o cadvisor.json     https://grafana.com/api/dashboards/14282/revisions/latest/download
            curl -fsSL -o loki.json         https://grafana.com/api/dashboards/13639/revisions/latest/download

            # заменяем плейсхолдеры датасорсов на наши UID
            sed -i 's/\${DS_PROMETHEUS}/prometheus/g' *.json
            sed -i 's/\${DS_LOKI}/loki/g'             *.json
            sed -i 's/\${DS_TEMPO}/tempo/g'           *.json
          EOF

      - name: Deploy stack
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "cd ~/smai/observability && docker compose pull && docker compose up -d --force-recreate"