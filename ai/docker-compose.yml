name: smai-ai

networks:
  default:
    name: smai-observability-net
    external: true

volumes:
  ollama_models:
    name: smai-ollama-models

services:
  ollama:
    image: ollama/ollama:0.6.2
    container_name: smai-ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_LLM_LIBRARY=cuda_v12
    volumes:
      - ollama_models:/root/.ollama
    networks: [default]
    ports:
      - "11434:11434"

  ollama-metrics:
    image: ghcr.io/norskhelsenett/ollama-metrics:latest
    container_name: smai-ollama-metrics
    restart: unless-stopped
    environment:
      OLLAMA_HOST: http://smai-ollama:11434
      PORT: "8080"
    networks: [default]
    ports:
      - "8080:8080"
    depends_on:
      - ollama