global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["smai-alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["smai-node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["smai-cadvisor:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["smai-otel-collector:8889"]

  - job_name: ollama
    static_configs:
      - targets: [ "sm-ai.netbird.selfhosted:8080" ]
        labels:
          instance: "ollama-ai"

  - job_name: ai-node-exporter
    static_configs:
      - targets: [ "sm-ai.netbird.selfhosted:9100" ]
        labels:
          instance: "ai-core"

  - job_name: ai-cadvisor
    static_configs:
      - targets: [ "sm-ai.netbird.selfhosted:8081" ]
        labels:
          instance: "ai-core"

  - job_name: gateway
    static_configs:
      - targets: ["smai-gateway:8000"]

  - job_name: recipes
    static_configs:
      - targets: ["smai-recipes:8000"]

  - job_name: dictionary
    static_configs:
      - targets: ["smai-dictionary:8000"]