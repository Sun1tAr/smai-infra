name: smai-services

networks:
  default:
    name: smai-observability-net
    external: true
  redis_net:
    name: smai-redis-net
    external: true

volumes:
  kiosk_apk_data:
    name: smai-kiosk-apk-data

# Ключ подписи JWT раскладывает deploy-security (секрет JWT_PRIVATE_KEY): UID 10001, 0400.
# В контейнере доступен только на чтение по пути /run/secrets/jwt_private_key.
secrets:
  jwt_private_key:
    file: ../security/jwt-private.pem

services:
  kiosk:
    image: ${KIOSK_IMAGE:-ghcr.io/sun1tar/smai-kiosk:latest}
    container_name: smai-kiosk
    restart: unless-stopped
    env_file: ./kiosk.env
    profiles: [kiosk]
    networks: [default]
    ports:
      - "8888:8000"
    volumes:
      - kiosk_apk_data:/kiosk


  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/sun1tar/smai-gateway:latest}
    container_name: smai-gateway
    restart: unless-stopped
    env_file: ./gateway.env
    profiles: [gateway]
    networks: [default, redis_net]
    secrets:
      - jwt_private_key
    ports:
      - "8000:8000"


  recipes:
    image: ${RECIPES_IMAGE:-ghcr.io/sun1tar/smai-recipes:latest}
    container_name: smai-recipes
    restart: unless-stopped
    env_file: ./recipes.env
    profiles: [recipes]
    networks: [default]

  dictionary:
    image: ${DICTIONARY_IMAGE:-ghcr.io/sun1tar/smai-dictionary:latest}
    container_name: smai-dictionary
    restart: unless-stopped
    env_file: ./dictionary.env
    profiles: [dictionary]
    networks: [default]

  user:
    image: ${USER_IMAGE:-ghcr.io/sun1tar/smai-user:latest}
    container_name: smai-user
    restart: unless-stopped
    env_file: ./user.env
    profiles: [user]
    networks: [default]